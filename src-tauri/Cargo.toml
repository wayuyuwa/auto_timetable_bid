[package]
name = "utar-course-bidding"
version = "1.0.0"
description = "UTAR Course Bidding (Tauri + Rust)"
authors = ["wayuyuwa"]
edition = "2021"
rust-version = "1.77"

# The library that the Tauri app and (optionally) integration tests share.
[lib]
name = "utar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
parking_lot = "0.12"
anyhow = "1"
log = "0.4"
once_cell = "1"
scraper = "0.29.0"
image = "0.25.6"
ort = { version = "2.0.0-rc.9", features = ["download-binaries", "load-dynamic"] }
reqwest = { version = "0.13.3", features = ["blocking", "cookies", "form"] }
chromiumoxide = { version = "0.7.0", default-features = false, features = ["tokio-runtime"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures = "0.3.34"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
