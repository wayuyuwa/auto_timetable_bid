name: Build and Release

# Builds the Windows app, zips it and attaches the zip to a GitHub Release.
# Release assets never expire (Actions artifacts are deleted after at most 90 days),
# so the Release is the permanent copy of every build.
#
#   push of a v* tag      -> Release "UnitRegTimetable <tag>" (pre-release when the tag ends in "beta")
#   manual "Run workflow" -> pre-release tagged build-<run number>, made from the chosen branch

on:
  push:
    tags:
      - 'v*' # Run when tag is pushed matching pattern v*, like v1.0.0
  workflow_dispatch: # Allow manual triggering

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Set up Node (build_exe.py builds the Vue frontend with npm)
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build executable
      run: python build_exe.py

    - name: Prepare release package
      run: |
        if (-not (Test-Path dist\UnitRegTimetable\UnitRegTimetable.exe)) { throw "Build did not produce dist\UnitRegTimetable\UnitRegTimetable.exe" }
        New-Item -ItemType Directory -Force release_package | Out-Null
        Copy-Item -Path dist\UnitRegTimetable\* -Destination release_package -Recurse
        Copy-Item config.ini release_package\ -Force
        if (Test-Path resources) { Copy-Item -Path resources -Destination release_package\resources -Recurse }
        Compress-Archive -Path release_package\* -DestinationPath UnitRegTimetable.zip -Force
        if (-not (Test-Path UnitRegTimetable.zip)) { throw "UnitRegTimetable.zip was not created" }
        "Zip size: {0:N1} MB" -f ((Get-Item UnitRegTimetable.zip).Length / 1MB)

    # Short-lived hand-over to the release job. The permanent copy is the Release asset.
    - name: Upload zip for the release job
      uses: actions/upload-artifact@v4
      with:
        name: UnitRegTimetable
        path: UnitRegTimetable.zip
        if-no-files-found: error
        compression-level: 0 # already a zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: UnitRegTimetable
        path: ./artifacts

    # v* tag: release for that tag. Manual run on a branch: new tag build-<run number> on the built commit.
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
        target_commitish: ${{ github.sha }}
        name: UnitRegTimetable ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0} ({1})', github.run_number, github.ref_name) }}
        draft: false
        prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') || endsWith(github.ref_name, 'beta') }}
        fail_on_unmatched_files: true
        files: |
          ./artifacts/UnitRegTimetable.zip
